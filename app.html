<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FPSC Exam Portal by Simply Commerce Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="/assets/logo.js"></script>
<style>
  :root{
    --ink:#1C2B5A; --ink-2:#142047; --gold:#F0AE34; --gold-soft:#FBE3B0;
    --paper:#F5F3EC; --surface:#fff; --line:#E3DFD3; --muted:#5D6372;
    --teal:#1F5A5C; --ok:#2E7D4F; --ok-bg:#E8F4EC; --bad:#B3362B; --bad-bg:#FBEDEA;
    --wa:#25D366; --yt:#FF0000;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --sans:"Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --urdu:"Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px}
  button{font-family:inherit}
  button:focus-visible,a:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

  /* header */
  header{background:linear-gradient(90deg,var(--ink-2),var(--ink)); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; position:relative; z-index:6}
  .disc{width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; flex:none;
    box-shadow:0 0 0 2px rgba(194,146,42,.6)}
  .disc img{width:30px; height:auto}
  .ht{flex:1; min-width:0}
  .ht b{font-family:var(--serif); font-size:19px; display:block; line-height:1.15}
  .ht span{font-size:12px; color:#c9cfe2}
  #who{display:flex; align-items:center; gap:10px; font-size:13px; color:#dfe3ef}
  #who button{background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px}
  .adminbar{position:relative; z-index:6; background:#FFF6DD; border-bottom:1px solid #EBD9A2; padding:8px 20px; font-size:13.5px; display:none; align-items:center; gap:12px; flex-wrap:wrap}
  .adminbar button{background:var(--ink); color:#fff; border:0; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px}
  nav{background:#fff; border-bottom:1px solid var(--line); display:flex; gap:2px; padding:0 14px; overflow-x:auto; position:sticky; top:0; z-index:5}
  nav button{background:none; border:0; border-bottom:3px solid transparent; padding:13px 14px; font-size:14.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap}
  nav button i{margin-right:7px; font-size:13px}
  nav button.on{color:var(--ink); border-bottom-color:var(--gold)}
  main{max-width:960px; margin:0 auto; padding:22px 16px 60px}
  main.wide{max-width:1140px}
  h2{font-family:var(--serif); font-size:22px; margin:6px 0 2px}
  .marks{color:var(--muted); font-size:13.5px; margin:0 0 12px}
  .tgrid + h2{margin-top:30px}
  .note{font-size:13.5px; color:var(--muted)}

  /* summary */
  .summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:0 0 14px}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .stat b{display:block; font-family:var(--serif); font-size:26px; line-height:1.1}
  .stat span{font-size:13px; color:var(--muted)}
  .stat.sun{background:var(--gold); border-color:var(--gold)} .stat.sun span{color:#5E400A}

  /* method strip and road to the test */
  .method{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:0 0 12px}
  .method button{all:unset; box-sizing:border-box; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:10px; padding:10px 12px}
  .method button:hover{border-color:#d9cfb5; border-top-color:var(--gold)}
  .method button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  .method small{display:block; font-size:10.5px; font-weight:800; letter-spacing:1.6px; color:#A7741A}
  .method b{display:block; font-size:15px; margin-top:2px}
  .method span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.35}
  .road{display:flex; align-items:center; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 22px; flex-wrap:wrap}
  .road .lbl{font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--teal); margin-right:14px}
  .road .st{display:flex; align-items:center; gap:7px; font-size:13px}
  .road .st i{width:11px; height:11px; border-radius:50%; border:2px solid var(--ink); display:inline-block}
  .road .st.goal i{background:var(--gold); border-color:var(--gold)}
  .road .bar{flex:1; min-width:18px; height:2px; background:#E6DFCD; margin:0 10px}

  /* topic cards */
  .secname{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--teal); margin:18px 0 8px; letter-spacing:.2px}
  .secname::after{content:""; flex:1; height:1px; background:var(--line)}
  .tgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .tcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .tcard h3{margin:0; font-size:15px; line-height:1.4; font-weight:600}
  .meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted)}
  .chip{padding:2px 9px; border-radius:999px; background:#EFEDE5}
  .chip.done{background:var(--ok-bg); color:var(--ok)}
  .meter{height:5px; background:#EFEDE5; border-radius:3px; overflow:hidden}
  .meter i{display:block; height:100%; background:var(--gold)}
  .tact{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
  .b{border:1px solid var(--ink); background:#fff; color:var(--ink); padding:7px 13px; border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer}
  .b.primary{background:var(--ink); color:#fff}
  .b.ghost{border-color:var(--line)}

  /* generic panels */
  .paper{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 20px 18px}
  .back{background:none; border:0; color:var(--ink); font-size:14px; cursor:pointer; padding:0; margin-bottom:12px; font-weight:600}
  .notes{white-space:pre-wrap; font-size:15px; line-height:1.7; max-width:70ch}
  .bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px}
  .btn{background:var(--ink); color:#fff; border:0; padding:11px 18px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--ink)}
  .btn[disabled]{opacity:.45; cursor:default}

  /* question (practice / mock) */
  .qnum{font-size:13px; color:var(--muted); margin-bottom:8px}
  .qtext{font-family:var(--serif); font-size:19px; line-height:1.45; margin-bottom:16px}
  .opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
    border-radius:10px; padding:11px 14px; margin-bottom:9px; font-size:15px; cursor:pointer; color:var(--ink); line-height:1.4}
  .opt .k{flex:none; width:26px; height:26px; border-radius:50%; background:#EFEDE5; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px}
  .opt:hover:not([disabled]){border-color:var(--ink)}
  .opt.chosen{border-color:var(--ink)} .opt.chosen .k{background:var(--ink); color:#fff}
  .opt.right{border-color:var(--ok); background:var(--ok-bg)} .opt.right .k{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg)} .opt.wrong .k{background:var(--bad); color:#fff}
  .opt[disabled]{cursor:default}
  .verdict{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:15px; padding:7px 14px; border-radius:999px}
  .verdict.ok{background:var(--ok-bg); color:var(--ok)} .verdict.no{background:var(--bad-bg); color:var(--bad)}
  #timer{font-weight:700; font-variant-numeric:tabular-nums} #timer.low{color:var(--bad)}
  .score{font-family:var(--serif); font-size:40px; text-align:center; margin:10px 0 2px}
  .score small{display:block; font-family:var(--sans); font-size:14px; color:var(--muted); margin-top:4px}
  .rev{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; font-size:14px}
  .rev .q{font-weight:600; margin-bottom:6px}
  .rev .you{color:var(--bad)} .rev .cor{color:var(--ok)}

  /* page turn (practice) */
  .book{position:relative; perspective:3200px; perspective-origin:30% 40%}
  .paper.turning{position:absolute; top:0; left:0; right:0; z-index:3; overflow:hidden; pointer-events:none;
    transform-origin:left center; backface-visibility:hidden; will-change:transform;
    animation:pageTurn .8s cubic-bezier(.5,.05,.3,1) forwards}
  .paper.turning::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(20,32,71,0) 35%, rgba(20,32,71,.10) 75%, rgba(20,32,71,.28));
    opacity:0; animation:pageShade .8s ease-in forwards}
  .book.flipping > .paper:not(.turning){animation:pageUnder .8s ease-out}
  @keyframes pageTurn{
    0%{transform:rotateY(0deg); box-shadow:0 0 0 rgba(20,32,71,0)}
    55%{opacity:1; box-shadow:-24px 6px 40px rgba(20,32,71,.28)}
    100%{transform:rotateY(-100deg); opacity:0; box-shadow:-40px 10px 50px rgba(20,32,71,0)}}
  @keyframes pageShade{0%{opacity:0} 70%{opacity:1} 100%{opacity:1}}
  @keyframes pageUnder{0%{filter:brightness(.9)} 100%{filter:brightness(1)}}
  @media (prefers-reduced-motion: reduce){ .paper.turning{display:none} .book.flipping > .paper{animation:none} }

  /* AI explain */
  .ai{margin-top:12px}
  .ai-btn{display:inline-flex; align-items:center; gap:8px; border:1px solid #CDB7F0; background:linear-gradient(180deg,#F7F2FF,#EFE6FF);
    color:#4B2A8C; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer}
  .ai-btn.sm{padding:5px 10px; font-size:12.5px}
  .ai-btn[disabled]{opacity:.7; cursor:wait}
  .ai-panel{margin-top:10px; border:1px solid #DDD0F5; background:#FBF9FF; border-radius:10px; padding:12px 14px}
  .ai-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; font-size:12.5px; font-weight:700; color:#4B2A8C}
  .ai-lang{border:1px solid #CDB7F0; background:#fff; color:#4B2A8C; border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:600; cursor:pointer}
  .ai-text{margin:0; font-size:14.5px; line-height:1.65; color:#262a36}
  .ai-text.ur{font-family:var(--urdu); direction:rtl; text-align:right; font-size:17px; line-height:2.25}
  .ai-foot{margin-top:6px; font-size:11.5px; color:var(--muted)}
  .ai-err{margin-top:8px; font-size:13px; color:var(--bad)}

  /* question bank (supplied sheet format) */
  .qb-chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
  .qb-chips button{border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 13px; border-radius:999px; font-size:13.5px; cursor:pointer; font-weight:600}
  .qb-chips button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .qb-tools{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 10px; flex-wrap:wrap}
  .mode{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff}
  .mode button{border:0; background:#fff; padding:7px 12px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer}
  .mode button.on{background:var(--teal); color:#fff}
  .qb-banner{background:linear-gradient(90deg,#2c6e8e,#6a4ea1); color:#fff; text-align:center; font-weight:700; font-size:14.5px; line-height:1.45;
    padding:10px 14px; border-radius:8px; margin-bottom:12px}
  .qb-cols{column-count:2; column-gap:14px}
  .qb-sec{display:flex; align-items:center; gap:8px; background:var(--teal); color:#fff; font-weight:700; font-size:14px;
    padding:7px 9px; border-radius:6px; margin:0 0 10px; break-inside:avoid; break-after:avoid}
  .qb-sec span{background:#fff; color:#1f2b3a; font-size:12px; padding:2px 6px; border-radius:3px; white-space:nowrap}
  .qb-card{break-inside:avoid; background:#fff; border:1px solid #dfe3ea; border-radius:8px; padding:11px 12px 10px; margin:0 0 10px}
  .qb-head{display:flex; gap:8px; align-items:flex-start}
  .qb-num{flex:none; min-width:22px; height:22px; padding:0 4px; border-radius:4px; background:#3b6fd6; color:#fff; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:1px}
  .qb-q{flex:1; font-weight:700; font-size:14.5px; line-height:1.38; color:#1f2b3a}
  .qb-ans{flex:none; width:22px; height:22px; border-radius:4px; color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px}
  .qb-ans.a{background:#3a9d4a} .qb-ans.b{background:#3b6fd6} .qb-ans.c{background:#8a4fc8} .qb-ans.d{background:#e8742c}
  .qb-opts{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin:8px 0 0 30px; font-size:13.5px; line-height:1.35; color:#2b3340}
  .qb-opt{display:flex; gap:6px; background:none; border:0; padding:2px 4px; margin:0 -4px; border-radius:5px; text-align:left; font-size:13.5px; color:inherit; line-height:1.35}
  .qb-opt b{color:var(--teal); flex:none}
  .qb-opt.right{color:#1d6b2c; font-weight:600}
  .qb-ex{margin:7px 0 0 30px; font-size:12.5px; color:var(--muted); font-style:italic}
  .qb-foot{margin:8px 0 0 30px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .qb-foot .ai{margin-top:0; flex-basis:100%}
  .qb-foot .verdict{font-size:13px; padding:4px 11px}
  /* self-test mode: answers hidden until the student picks */
  .self .qb-card:not(.done) .qb-ans{visibility:hidden}
  .self .qb-card:not(.done) .qb-opt.right{color:#2b3340; font-weight:400}
  .self .qb-card:not(.done) .qb-opt{cursor:pointer}
  .self .qb-card:not(.done) .qb-opt:hover{background:#F1F4F8}
  .self .qb-card .qb-ex{display:none}
  .qb-opt.picked-right{background:var(--ok-bg); color:var(--ok); font-weight:600}
  .qb-opt.picked-wrong{background:var(--bad-bg); color:var(--bad); font-weight:600}

  .tools-r{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .pbtn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer}
  .pbtn:hover{border-color:#c9c3b2}
  .print-head,.print-key{display:none}

  /* topic view: one topic, clean single column */
  .tv-head{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px}
  .tv-kicker{font-size:12px; font-weight:700; color:var(--teal); letter-spacing:.3px}
  .tv-head h2{margin:4px 0 10px; font-size:21px; line-height:1.3}
  .tv-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .tv-list .qb-card{padding:16px 18px 14px; margin-bottom:12px; border-color:var(--line); border-radius:12px}
  .tv-list .qb-q{font-family:var(--serif); font-weight:600; font-size:16.5px; line-height:1.45}
  .tv-list .qb-num{background:var(--ink); min-width:26px; height:26px; font-size:13px; border-radius:50%}
  .tv-list .qb-opts{margin:12px 0 0 36px; gap:6px 18px; font-size:14.5px}
  .tv-list .qb-opt{font-size:14.5px; padding:5px 8px; margin:0 -8px}
  .tv-list .qb-ex,.tv-list .qb-foot{margin-left:36px}

  @media print{
    @page{margin:12mm}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    body{background:#fff; font-size:12px}
    header,nav,.adminbar,footer,.back,.qb-chips,.qb-tools,.tv-bar,.qb-foot,.ai{display:none !important}
    main,main.wide{max-width:none; padding:0}
    .print-head{display:flex; gap:12px; align-items:center; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:12px; font-size:12px}
    .print-head img{width:38px; height:auto}
    .print-head .pt{font-family:var(--serif); font-size:17px; font-weight:700; margin-top:2px}
    .print-head .pm{color:#555; font-size:11px; margin-top:2px}
    .tv-head{border:0; padding:0; margin:0 0 8px} .tv-head h2,.tv-kicker{display:none}
    .tv-list{column-count:2; column-gap:14px}
    .tv-list .qb-card,.qb-card{break-inside:avoid; border:1px solid #ccc; border-radius:6px; padding:8px 9px; margin:0 0 8px}
    .qb-q,.tv-list .qb-q{font-family:var(--sans); font-size:12.5px; font-weight:700}
    .qb-banner{padding:6px 10px; font-size:12.5px} .qb-sec{font-size:12.5px; padding:5px 8px}
    .tv-list .qb-opts,.tv-list .qb-ex{margin-left:30px}
    .qb-opts{font-size:12px} .tv-list .qb-opt,.qb-opt{font-size:12px; padding:1px 4px}
    .self .qb-card .qb-ans{visibility:hidden !important}
    .self .qb-opt,.self .qb-opt.right,.self .qb-opt.picked-right,.self .qb-opt.picked-wrong{background:none !important; color:#2b3340 !important; font-weight:400 !important}
    .print-key{display:block; break-before:page}
    .print-key h3{font-family:var(--serif); font-size:16px; margin:0 0 8px}
    .pkey-grid{display:grid; grid-template-columns:repeat(10,1fr); gap:4px 10px; font-size:12px}
  }

  table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); font-size:14px; border-radius:10px; overflow:hidden}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line)}
  th{background:#FAF8F2; font-size:12.5px; color:var(--muted)}
  td.r,th.r{text-align:right}
  .tablewrap{overflow-x:auto}
  .lockmsg{max-width:440px; margin:60px auto; background:#fff; border-top:4px solid var(--gold); border-radius:12px; padding:26px; text-align:center}

  footer{position:relative; z-index:4; border-top:1px solid var(--line); background:#fff; padding:18px 16px 26px; text-align:center}
  .social{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .social a{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; border:1px solid var(--line); color:var(--ink); text-decoration:none; font-size:13.5px; font-weight:600}
  .social .fa-whatsapp{color:var(--wa); font-size:18px} .social .fa-youtube{color:var(--yt); font-size:18px}
  .made{margin-top:10px; font-size:12.5px; color:var(--muted)}

  @media (max-width:760px){
    .tgrid,.summary{grid-template-columns:1fr}
    .summary{grid-template-columns:repeat(2,1fr)} .stat{padding:10px} .stat b{font-size:21px}
    .method{grid-template-columns:1fr 1fr} .road .bar{display:none} .road{gap:6px 14px} .road .lbl{flex-basis:100%}
    .qb-cols{column-count:1} .qb-opts{grid-template-columns:1fr}
    .ht span{display:none} #who .nm{display:none}
    .qtext{font-size:17.5px}
  }
</style>
</head>
<body>
<header>
  <div class="disc"><img id="logo" alt=""></div>
  <div class="ht"><b>FPSC Exam Portal</b><span>Simply Commerce Academy · Assistant Audit Officer (BS-17)</span></div>
  <div id="who"></div>
</header>
<div class="adminbar" id="adminbar">
  <span><b>Admin preview.</b> You are seeing the portal as a student sees it. Your attempts here are not saved.</span>
  <button onclick="location.href='/admin.html'">Back to admin panel</button>
</div>
<nav id="nav" style="display:none">
  <button data-v="syllabus" class="on"><i class="fa-solid fa-book-open"></i>Syllabus &amp; practice</button>
  <button data-v="bank"><i class="fa-solid fa-layer-group"></i>Question bank</button>
  <button data-v="mock"><i class="fa-solid fa-stopwatch"></i>Mock test</button>
  <button data-v="progress"><i class="fa-solid fa-chart-line"></i>My progress</button>
</nav>
<main id="main"><p class="note">Loading…</p></main>
<footer>
  <div class="social">

<script>
document.getElementById("logo").src = window.SCA_LOGO;
const fav = document.createElement("link"); fav.rel="icon"; fav.href=window.SCA_LOGO; document.head.appendChild(fav);

const M = document.getElementById("main");
let ME=null, TOPICS=[], PROG={byTopic:[],recent:[]}, mockTimer=null;

const api = async (p, opts) => {
  const r = await fetch("/api"+p, opts);
  let d=null; try{ d = await r.json(); }catch{}
  if(r.status===401){ location.href="/"; throw 0; }
  if(r.status===403 && d && (d.error==="expired"||d.error==="inactive")){ locked(d); throw 0; }
  return d;
};
function locked(d){
  document.getElementById("nav").style.display="none";
  M.innerHTML = `<div class="lockmsg">
    <h2>${d.error==="expired"?"Access has ended":"Account not active"}</h2>
    <p class="note">${d.error==="expired" ? "Portal access for this exam cycle ended on "+d.expiry+"." : "Your account has been deactivated."}
      <br>Message us on WhatsApp if you think this is a mistake.</p>
    <button class="btn" onclick="signout()">Logout</button></div>`;
}
async function signout(){ await fetch("/api/logout",{method:"POST"}); location.href="/"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function bestFor(id){ const r = PROG.byTopic.find(x=>x.topic_id===id); return r ? r.best : null; }
function topicName(id){ const t = TOPICS.find(t=>t.id===id); return t ? t.title : "—"; }
const L = ["a","b","c","d"];

/* ---------- AI explain ---------- */
const AIC = {};
function aiBox(id, small){
  return `<div class="ai"><button class="ai-btn ${small?"sm":""}" onclick="explain(${id}, this)"><i class="fa-solid fa-wand-magic-sparkles"></i>AI explain</button></div>`;
}
async function explain(id, btn){
  const box = btn.closest(".ai");
  if(!AIC[id]){
    btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>Explaining…`;
    let d = null;
    try{ d = await api("/explain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}); }catch(e){ if(e===0) return; }
    if(!d || !d.ok){
      btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i>AI explain`;
      const old = box.querySelector(".ai-err"); if(old) old.remove();
      box.insertAdjacentHTML("beforeend", `<div class="ai-err">${esc((d&&d.message)||"Could not reach the AI. Please try again.")}${d&&d.detail?`<br><small>Admin detail: ${d.detail.map(esc).join(" | ")}</small>`:""}</div>`);
      return;
    }
    AIC[id] = {en:d.en, ur:d.ur};
  }
  box.innerHTML = `<div class="ai-panel">
    <div class="ai-head"><span><i class="fa-solid fa-wand-magic-sparkles"></i> AI explanation</span>
      <button class="ai-lang" onclick="aiLang(${id}, this)">اردو میں پڑھیں</button></div>
    <p class="ai-text">${esc(AIC[id].en)}</p>
    <div class="ai-foot">AI-generated. It can make mistakes.</div></div>`;
}
function aiLang(id, b){
  const p = b.closest(".ai-panel").querySelector(".ai-text");
  const toUrdu = !p.classList.contains("ur");
  p.classList.toggle("ur", toUrdu); p.lang = toUrdu ? "ur" : "en";
  p.textContent = toUrdu ? AIC[id].ur : AIC[id].en;
  b.textContent = toUrdu ? "Read in English" : "اردو میں پڑھیں";
}

/* ---------- syllabus ---------- */
function viewSyllabus(){
  const total = TOPICS.reduce((a,t)=>a+(t.n||0),0);
  const practised = TOPICS.filter(t=>bestFor(t.id)!==null).length;
  const mocks = PROG.recent.filter(a=>a.kind==="mock");
  const bestMock = mocks.length ? Math.max(...mocks.map(a=>Math.round(100*a.score/a.total)))+"%" : "—";
  const pk = new Date(Date.now() + (new Date().getTimezoneOffset() + 300) * 60000);
  const daysLeft = Math.ceil((new Date("2027-01-02T00:00:00") - pk) / 86400000);
  let h = `<div class="summary">
    <div class="stat"><b>${total}</b><span>MCQs in the bank</span></div>
    <div class="stat"><b>${practised}/${TOPICS.length}</b><span>Topics practiced</span></div>
    <div class="stat"><b>${bestMock}</b><span>Best mock score</span></div>
    ${daysLeft>0?`<div class="stat sun"><b>${daysLeft}</b><span>Days to the written test</span></div>`:""}</div>
    <div class="method">
      <button onclick="show('bank')"><small>STEP 1</small><b>Learn</b><span>Study the question bank, with AI explanations</span></button>
      <button onclick="document.querySelector('.tcard .b.primary').scrollIntoView({behavior:'smooth',block:'center'})"><small>STEP 2</small><b>Practice</b><span>20 questions at a time, with instant Correct or Wrong</span></button>
      <button onclick="show('mock')"><small>STEP 3</small><b>Test</b><span>Full 100-MCQ timed mock on the paper pattern</span></button>
      <button onclick="show('progress')"><small>STEP 4</small><b>Revise</b><span>My progress shows your weakest topics</span></button>
    </div>
    <div class="road"><span class="lbl">Road to the test</span>
      <span class="st"><i></i>23 Nov · Last date to apply</span><span class="bar"></span>
      <span class="st"><i></i>December · Revision &amp; final mocks</span><span class="bar"></span>
      <span class="st goal"><i></i><b>2 Jan 2027 · Written test</b></span></div>`;
  const parts = [
    {part:"I",  head:"Part-I · English", marks:"20 marks of 100"},
    {part:"II", head:"Part-II · Professional", marks:"80 marks of 100 · accounting, auditing and public-sector finance"},
  ];
  for(const p of parts){
    h += `<h2>${p.head}</h2><p class="marks">${p.marks}</p>`;
    const ts = TOPICS.filter(t=>t.part===p.part);
    const secs = [...new Set(ts.map(t=>t.section))];
    for(const s of secs){
      if(secs.length>1) h += `<div class="secname">${esc(s)}</div>`;
      h += `<div class="tgrid">`;
      for(const t of ts.filter(x=>x.section===s)){
        const b = bestFor(t.id);
        h += `<div class="tcard">
          <h3>${esc(t.title)}</h3>
          <div class="meta"><span class="chip">${t.n} MCQs</span><span class="chip ${b!==null?"done":""}">${b!==null?"Best "+b+"%":"Not practiced"}</span></div>
          <div class="meter"><i style="width:${b||0}%"></i></div>
          <div class="tact">
            <button class="b primary" onclick="startPractice(${t.id})">Practice</button>
            ${t.has_notes?`<button class="b ghost" onclick="openNotes(${t.id})">Notes</button>`:""}
          </div></div>`;
      }
      h += `</div>`;
    }
  }
  M.innerHTML = h;
}
async function openNotes(id){
  const d = await api("/notes?id="+id);
  M.innerHTML = `<button class="back" onclick="show('syllabus')">&larr; Back to syllabus</button>
    <div class="paper"><h2>${esc(d.topic.title)}</h2><p class="marks">Part-${d.topic.part} · ${esc(d.topic.section)}</p>
    <div class="notes">${esc(d.topic.notes)}</div>
    <div class="bar"><span></span><button class="btn" onclick="startPractice(${d.topic.id})">Practice this topic</button></div></div>`;
  window.scrollTo(0,0);
}

/* ---------- practice ---------- */
let P=null;
async function startPractice(id){
  const d = await api("/mcqs?topic_id="+id+"&limit=20");
  if(!d.questions.length){ alert("No questions in this topic yet."); return; }
  P = {topic:id, qs:d.questions, i:0, score:0};
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v==="syllabus"));
  renderPractice();
}
function renderPractice(turn){
  const q = P.qs[P.i];
  const old = turn ? M.querySelector(".book > .paper:not(.turning)") : null;
  const oldHeight = old ? old.getBoundingClientRect().height : 0, oldHTML = old ? old.innerHTML : "";
  M.innerHTML = `<button class="back" onclick="show('syllabus')">&larr; Quit practice</button>
    <div class="book"><div class="paper">
      <div class="qnum">Question ${P.i+1} of ${P.qs.length} · ${esc(topicName(P.topic))}</div>
      <div class="qtext">${esc(q.question)}</div>
      ${L.map(k=>`<button class="opt" data-k="${k}" onclick="answer('${k}')"><span class="k">${k.toUpperCase()}</span><span>${esc(q[k])}</span></button>`).join("")}
      <div id="fb"></div>
      <div class="bar"><span class="note" id="sc">Score so far: ${P.score}</span><button class="btn" id="nx" style="display:none" onclick="nextP()">Next</button></div>
    </div></div>`;
  window.scrollTo(0,0);
  if(old && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    // lay the previous question over the new one and turn it away like a book page
    const book = M.querySelector(".book"), page = document.createElement("div");
    page.className = "paper turning"; page.setAttribute("aria-hidden","true");
    page.innerHTML = oldHTML; page.style.height = oldHeight + "px";
    page.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    book.appendChild(page); book.classList.add("flipping");
    const done = () => { page.remove(); book.classList.remove("flipping"); };
    page.addEventListener("animationend", e => { if(e.target===page) done(); });
    setTimeout(done, 1200);
  }
}
function answer(k){
  const q = P.qs[P.i], ok = k===q.correct;
  document.querySelectorAll(".opt").forEach(o=>{
    o.disabled = true;
    if(o.dataset.k===q.correct) o.classList.add("right");
    if(o.dataset.k===k && !ok) o.classList.add("wrong");
  });
  if(ok) P.score++;
  document.getElementById("sc").textContent = "Score so far: "+P.score;
  document.getElementById("fb").innerHTML = `<div class="${ok?"verdict ok":"verdict no"}"><i class="fa-solid ${ok?"fa-circle-check":"fa-circle-xmark"}"></i>${ok?"Correct":"Wrong"}</div>${aiBox(q.id)}`;
  const nx = document.getElementById("nx"); nx.style.display="inline-block"; nx.textContent = P.i+1 < P.qs.length ? "Next" : "Finish";
}
async function nextP(){
  P.i++;
  if(P.i < P.qs.length){ renderPractice(true); return; }
  await api("/attempt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"practice",topic_id:P.topic,score:P.score,total:P.qs.length})});
  const pct = Math.round(100*P.score/P.qs.length);
  M.innerHTML = `<div class="paper" style="text-align:center"><h2>Practice complete</h2>
    <div class="score">${P.score} / ${P.qs.length}<small>${pct}% · ${esc(topicName(P.topic))}</small></div>
    <div class="bar" style="justify-content:center"><button class="btn ghost" onclick="startPractice(${P.topic})">Try again</button>
    <button class="btn" onclick="refreshProgress().then(()=>show('syllabus'))">Back to syllabus</button></div></div>`;
}

/* ---------- question bank & topic MCQs ---------- */
let BANK = {section:"all", self:false};
let TV = {id:null, self:false};
function openBank(section){ BANK.section = section; show("bank"); }
function qCard(q, n, self){
  return `<div class="qb-card" data-c="${q.correct}" data-id="${q.id}">
    <div class="qb-head"><span class="qb-num">${n}</span><div class="qb-q">${esc(q.question)}</div><span class="qb-ans ${q.correct}">${q.correct.toUpperCase()}</span></div>
    <div class="qb-opts">${L.map(k=>`<button class="qb-opt ${k===q.correct?"right":""}" data-k="${k}" onclick="pickBank(this)"><b>${k.toUpperCase()}</b><span>${esc(q[k])}</span></button>`).join("")}</div>
    ${q.explanation?`<div class="qb-ex">${esc(q.explanation)}</div>`:""}
    <div class="qb-foot">${self?"":aiBox(q.id,true)}</div>
  </div>`;
}
function modeToggle(self, fn){
  return `<div class="mode"><button class="${self?"":"on"}" onclick="${fn}(false)">Show answers</button><button class="${self?"on":""}" onclick="${fn}(true)">Hide answers</button></div>`;
}
const printBtn = `<button class="pbtn" onclick="printQuestions()"><i class="fa-solid fa-print"></i>Print</button>`;
function setBankSelf(v){ BANK.self = v; viewBank(); }
async function viewBank(){
  M.classList.add("wide");
  const groups = ["all", ...new Set(TOPICS.map(t=>t.section))];
  const chips = groups.map(g=>`<button class="${g===BANK.section?"on":""}" onclick="BANK.section='${esc(g)}';viewBank()">${g==="all"?"All topics":esc(g)}</button>`).join("");
  M.innerHTML = `<div class="qb-chips">${chips}</div><p class="note">Loading questions…</p>`;
  const d = await api("/bank?section="+encodeURIComponent(BANK.section));
  const qs = d.questions, topics = TOPICS.filter(t=>qs.some(q=>q.topic_id===t.id));
  const title = BANK.section==="all" ? "Complete question bank" : BANK.section;
  let n = 0, body = "";
  topics.forEach((t,i)=>{
    body += `<div class="qb-sec"><span>Section ${String.fromCharCode(65+i)}</span>${esc(t.title)}</div>`;
    for(const q of qs.filter(x=>x.topic_id===t.id)) body += qCard(q, ++n, BANK.self);
  });
  M.innerHTML = `<div class="${BANK.self?"self":""}" id="qbw" data-title="${esc(title)}" data-count="${qs.length}">
    <div class="print-head" id="phead"></div>
    <div class="qb-chips">${chips}</div>
    <div class="qb-tools"><span class="note">${BANK.self?"Pick an answer on any card to check yourself.":"Answers are marked in green."}</span>
      <div class="tools-r">${modeToggle(BANK.self,"setBankSelf")}${printBtn}</div></div>
    <div class="qb-banner">${esc(title)} — FPSC Assistant Audit Officer (BS-17) · ${qs.length} MCQs with answers</div>
    ${qs.length?`<div class="qb-cols">${body}</div>`:`<p class="note">No questions in this group yet.</p>`}
    <div class="print-key" id="pkey"></div></div>`;
}

function pickBank(btn){
  const card = btn.closest(".qb-card");
  if(!card.closest(".self") || card.classList.contains("done")) return;
  const ok = btn.dataset.k === card.dataset.c;
  card.classList.add("done");
  btn.classList.add(ok?"picked-right":"picked-wrong");
  card.querySelector(".qb-foot").innerHTML = `<span class="verdict ${ok?"ok":"no"}"><i class="fa-solid ${ok?"fa-circle-check":"fa-circle-xmark"}"></i>${ok?"Correct":"Wrong"}</span>${aiBox(Number(card.dataset.id),true)}`;
}

/* print whatever list is on screen: with answers, or as a worksheet with an answer key at the end */
function printQuestions(){
  const w = document.getElementById("qbw"); if(!w) return;
  const worksheet = w.classList.contains("self");
  const cards = [...w.querySelectorAll(".qb-card")];
  const today = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  document.getElementById("phead").innerHTML = `<img src="${window.SCA_LOGO}" alt="">
    <div><b>FPSC Exam Portal</b> · Simply Commerce Academy · Assistant Audit Officer (BS-17)
    <div class="pt">${esc(w.dataset.title)}</div>
    <div class="pm">${w.dataset.count} MCQs · ${worksheet?"Worksheet, answers at the end":"With answers"} · Printed for ${esc(ME.name)} on ${today}</div></div>`;
  document.getElementById("pkey").innerHTML = worksheet && cards.length
    ? `<h3>Answer key</h3><div class="pkey-grid">${cards.map((c,i)=>`<span><b>${i+1}.</b> ${c.dataset.c.toUpperCase()}</span>`).join("")}</div>` : "";
  window.print();
}

/* ---------- mock ---------- */
let K=null;
function viewMock(){
  M.innerHTML = `<div class="paper"><h2>Mock test</h2>
    <p class="notes" style="white-space:normal">The paper is 100 MCQs: 20 English and 80 professional. This mock draws the same mix at random from the question bank and runs on a timer. Answers are shown at the end, not during the test.</p>
    <div class="bar"><span></span><button class="btn" onclick="startMock()">Start mock test</button></div></div>`;
}
async function startMock(){
  const d = await api("/mock");
  if(!d.questions.length){ alert("No questions available yet."); return; }
  K = {qs:d.questions, i:0, ans:Array(d.questions.length).fill(null), ends:Date.now()+d.minutes*60000};
  clearInterval(mockTimer); mockTimer = setInterval(tick, 500); renderMock();
}
function tick(){
  if(!K) return;
  const left = K.ends - Date.now(), el = document.getElementById("timer");
  if(left<=0){ finishMock(); return; }
  if(el){ const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); el.textContent=m+":"+String(s).padStart(2,"0"); el.classList.toggle("low", left<5*60000); }
}
function renderMock(){
  const q = K.qs[K.i], picked = K.ans[K.i];
  M.innerHTML = `<div class="paper">
    <div class="bar" style="margin-top:0"><span class="qnum">Question ${K.i+1} of ${K.qs.length} · Part-${q.part}</span><span class="note"><i class="fa-regular fa-clock"></i> <span id="timer">--:--</span></span></div>
    <div class="qtext">${esc(q.question)}</div>
    ${L.map(k=>`<button class="opt ${picked===k?"chosen":""}" onclick="pick('${k}')"><span class="k">${k.toUpperCase()}</span><span>${esc(q[k])}</span></button>`).join("")}
    <div class="bar"><button class="btn ghost" ${K.i===0?"disabled":""} onclick="K.i--;renderMock()">Previous</button>
      <span class="note">${K.ans.filter(a=>a).length} answered</span>
      ${K.i+1<K.qs.length?`<button class="btn" onclick="K.i++;renderMock()">Next</button>`:`<button class="btn" onclick="finishMock()">Finish test</button>`}</div></div>`;
  tick();
}
function pick(k){ K.ans[K.i]=k; if(K.i+1<K.qs.length) K.i++; renderMock(); }
async function finishMock(){
  clearInterval(mockTimer); if(!K) return;
  const qs=K.qs, ans=K.ans; K=null;
  let score=0; qs.forEach((q,i)=>{ if(ans[i]===q.correct) score++; });
  await api("/attempt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"mock",score,total:qs.length})});
  const pct = Math.round(100*score/qs.length);
  const wrong = qs.map((q,i)=>({q,i})).filter(x=>ans[x.i]!==x.q.correct);
  M.innerHTML = `<div class="paper" style="text-align:center"><h2>Mock test result</h2><div class="score">${score} / ${qs.length}<small>${pct}%</small></div></div>
    <h2 style="margin-top:22px">Review${wrong.length?` · ${wrong.length} to revisit`:""}</h2>
    ${wrong.length? wrong.map(x=>`<div class="rev"><div class="q">${esc(x.q.question)}</div>
      <div>${ans[x.i]?`<span class="you"><i class="fa-solid fa-circle-xmark"></i> Your answer: ${ans[x.i].toUpperCase()}. ${esc(x.q[ans[x.i]])}</span>`:`<span class="you">Not answered</span>`}</div>
      <div><span class="cor"><i class="fa-solid fa-circle-check"></i> Correct: ${x.q.correct.toUpperCase()}. ${esc(x.q[x.q.correct])}</span></div>
      ${aiBox(x.q.id,true)}</div>`).join("") : `<p class="note">Everything correct. Well done.</p>`}
    <div class="bar"><span></span><button class="btn" onclick="refreshProgress().then(()=>show('progress'))">See my progress</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- progress ---------- */
function viewProgress(){
  const rows = PROG.recent.map(a=>`<tr><td>${a.kind==="mock"?"Mock test":"Practice"}</td><td>${a.topic_id?esc(topicName(a.topic_id)):"Full paper mix"}</td>
    <td class="r">${a.score} / ${a.total}</td><td class="r">${Math.round(100*a.score/a.total)}%</td><td class="r">${a.created_at.slice(0,10)}</td></tr>`).join("");
  const tops = PROG.byTopic.map(b=>`<tr><td>${esc(topicName(b.topic_id))}</td><td class="r">${b.attempts}</td><td class="r">${b.best}%</td></tr>`).join("");
  M.innerHTML = `<h2>Recent attempts</h2>
    ${rows?`<div class="tablewrap"><table><tr><th>Type</th><th>Topic</th><th class="r">Score</th><th class="r">%</th><th class="r">Date</th></tr>${rows}</table></div>`
      :`<p class="note">Nothing attempted yet. Pick a topic on the Syllabus tab and practice it.</p>`}
    <h2 style="margin-top:24px">By topic</h2>
    ${tops?`<div class="tablewrap"><table><tr><th>Topic</th><th class="r">Attempts</th><th class="r">Best</th></tr>${tops}</table></div>`
      :`<p class="note">Topic scores appear here after your first practice.</p>`}`;
}

/* ---------- shell ---------- */
async function refreshProgress(){ PROG = await api("/progress"); }
function show(v){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  clearInterval(mockTimer); K=null; M.classList.remove("wide");
  if(v==="syllabus") viewSyllabus(); else if(v==="bank") viewBank(); else if(v==="mock") viewMock(); else viewProgress();
  window.scrollTo(0,0);
}
document.getElementById("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.v); });
(async function init(){
  try{
    ME = await api("/me");
    if(ME.role==="admin") document.getElementById("adminbar").style.display="flex";
    document.getElementById("who").innerHTML = `<span class="nm">${esc(ME.name)}</span><button onclick="signout()">Logout</button>`;
    const c = await api("/content"); TOPICS = c.topics;
    await refreshProgress();
    document.getElementById("nav").style.display="flex";
    show("syllabus");
  }catch(e){}
})();
</script>
